%YAML:1.0

#--------------------------------------------------------------------------------------------
# Camera Parameters. Adjust them!
#--------------------------------------------------------------------------------------------
File.version: "1.0"

Camera.type: "PinHole"

# Camera calibration and distortion parameters (OpenCV) 
# Camera1.fx: 458.654
# Camera1.fy: 457.296
# Camera1.cx: 367.215
# Camera1.cy: 248.375

# Camera1.k1: -0.28340811
# Camera1.k2: 0.07395907
# Camera1.p1: 0.00019359
# Camera1.p2: 1.76187114e-05

# # Camera resolution
# Camera.width: 752
# Camera.height: 480

# Camera.newWidth: 600
# Camera.newHeight: 350

# # Camera frames per second 
# Camera.fps: 20

# # Color order of the images (0: BGR, 1: RGB. It is ignored if images are grayscale)
# Camera.RGB: 1

# # Transformation from camera to body-frame (imu)
# IMU.T_b_c1: !!opencv-matrix
#    rows: 4
#    cols: 4
#    dt: f
#    data: [0.0148655429818, -0.999880929698, 0.00414029679422, -0.0216401454975,
#          0.999557249008, 0.0149672133247, 0.025715529948, -0.064676986768,
#         -0.0257744366974, 0.00375618835797, 0.999660727178, 0.00981073058949,
#          0.0, 0.0, 0.0, 1.0]

# # IMU noise
# IMU.NoiseGyro: 1.7e-4 #1.6968e-04
# IMU.NoiseAcc: 2.0000e-3 #2.0e-3
# IMU.GyroWalk: 1.9393e-05 
# IMU.AccWalk: 3.0000e-03 # 3e-03
# IMU.Frequency: 200.0


Camera1.fx: 916.5015082697165
Camera1.fy: 915.0838428431339
Camera1.cx: 641.8111584667326
Camera1.cy: 356.47367070154854

Camera1.k1: 0.07809695842091514
Camera1.k2:  -0.14615549029696379
Camera1.p1: -0.0012996168394458663
Camera1.p2: -0.0015239186911521914

# Camera resolution
Camera.width: 1280
Camera.height: 720

#maintain aspect ratio. scale by width
# sf = newwidth / width = 600 / 1280 = 0.46875
# newHeight = height * scalefactor = 337.5 = 338
Camera.newWidth: 600
Camera.newHeight: 338

# Camera frames per second 
Camera.fps: 8

# Color order of the images (0: BGR, 1: RGB. It is ignored if images are grayscale)
Camera.RGB: 1

# data: [0.0148655429818, -0.999880929698, 0.00414029679422, -0.0216401454975,
#          0.999557249008, 0.0149672133247, 0.025715529948, -0.064676986768,
#         -0.0257744366974, 0.00375618835797, 0.999660727178, 0.00981073058949,
#          0.0, 0.0, 0.0, 1.0]


# Transformation from camera to body-frame (imu)
IMU.T_b_c1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [1,0,0,-0.005,
         0,1,0,-0.005,
         0,0,1,0.0117,
         0.0, 0.0, 0.0, 1.0]


# IMU noise (Use those from VINS-mono)
IMU.NoiseGyro: 1e-3 # 2.44e-4 #1e-3 # rad/s^0.5
IMU.NoiseAcc: 1e-2 # 1.47e-3 #1e-2 # m/s^1.5
IMU.GyroWalk: 1e-6 # rad/s^1.5
IMU.AccWalk: 1e-4 # m/s^2.5
IMU.Frequency: 200.0
#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------

# ORB Extractor: Number of features per image
ORBextractor.nFeatures: 1000 # 1000

# ORB Extractor: Scale factor between levels in the scale pyramid 	
ORBextractor.scaleFactor: 1.2

# ORB Extractor: Number of levels in the scale pyramid	
ORBextractor.nLevels: 8

# ORB Extractor: Fast threshold
# Image is divided in a grid. At each cell FAST are extracted imposing a minimum response.
# Firstly we impose iniThFAST. If no corners are detected we impose a lower value minThFAST
# You can lower these values if your images have low contrast			
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -3.5 # -1.8
Viewer.ViewpointF: 500.0

